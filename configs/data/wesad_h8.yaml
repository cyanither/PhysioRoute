name: wesad
raw_dir: data/raw/wesad
processed_dir: data/processed/wesad_h8
target_fs: 64
input_sec: 60
horizon_sec: 8
short_horizon_sec: 10
stride_sec: 5
label_fs: 700
stress_label: 2
stress_onset_only: true
output_dtype: float32
max_subjects: null
subject_split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42
nodes:
  - name: ecg
    source: chest
    key: ECG
    fs: 700
    filter: ecg
  - name: resp
    source: chest
    key: Resp
    fs: 700
    filter: resp
  - name: wrist_bvp
    source: wrist
    key: BVP
    fs: 64
    filter: ppg
  - name: wrist_eda
    source: wrist
    key: EDA
    fs: 4
    filter: none
  - name: wrist_temp
    source: wrist
    key: TEMP
    fs: 4
    filter: none
  - name: wrist_acc_x
    source: wrist
    key: ACC
    axis: 0
    fs: 32
    filter: none
  - name: wrist_acc_y
    source: wrist
    key: ACC
    axis: 1
    fs: 32
    filter: none
  - name: wrist_acc_z
    source: wrist
    key: ACC
    axis: 2
    fs: 32
    filter: none
